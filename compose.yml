# TTS Adapter - Local Development
# Usage:
#   Qwen3 only: docker compose --profile gpu up --build
#   Qwen3 + IndexTTS2: docker compose --profile gpu --profile indextts2 up --build
#   Easiest: `make up` (auto-detects which engines are installed)
#
# Note: TTS requires GPU (qwen-tts needs CUDA)

name: tts

networks:
  render-network:
    name: render-network
    driver: bridge

# GPU reservation block (shared via YAML anchor)
x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

# Shared volume + env mounts (HF cache + repo-local models + .env)
x-shared-mounts: &shared-mounts
  volumes:
    - ${HF_CACHE_PATH:-~/.cache/huggingface}:/home/app/.cache/huggingface
    - ./models:/work/models
  env_file:
    - .env

services:
  # Main TTS adapter (Qwen3 in-process + HTTP forwarder for IndexTTS2RemoteEngine)
  adapter-tts:
    <<: [*gpu, *shared-mounts]
    container_name: adapter-tts
    profiles: ["gpu"]
    restart: unless-stopped
    pull_policy: missing
    image: ${CI_REGISTRY_IMAGE:-tts}/adapter-tts:${CI_COMMIT_REF_SLUG:-latest}-${CI_PIPELINE_ID:-local}
    # Override TTS_INDEXTTS2_URL inside the container: localhost from .env would
    # point to adapter-tts itself, not to the worker. Use the worker container's
    # network hostname instead. TTS_INDEXTTS2_DOCKER_URL env var on host can
    # override this further if needed (e.g. cross-host worker).
    environment:
      TTS_INDEXTTS2_URL: ${TTS_INDEXTTS2_DOCKER_URL:-http://adapter-tts-indextts2:9881}
    ports:
      - "${TTS_PORT:-9880}:9880"
    networks:
      - default
      - render-network
    build:
      context: .
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9880/health', timeout=10)"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  # IndexTTS2 worker - THIN bind-mount image.
  # The vendor venv (~10 GB) lives on the host (built by `make install-indextts2`)
  # and is bind-mounted at /work/vendor/index-tts. This avoids duplicating the
  # torch/CUDA/transformers stack inside the container layer.
  # Activated only when --profile indextts2 is passed.
  # `make up` auto-adds this profile when models/indextts2/IndexTTS-2/ exists.
  adapter-tts-indextts2:
    <<: *gpu
    container_name: adapter-tts-indextts2
    profiles: ["indextts2"]
    restart: unless-stopped
    pull_policy: missing
    image: ${CI_REGISTRY_IMAGE:-tts}/adapter-tts-indextts2:${CI_COMMIT_REF_SLUG:-latest}-${CI_PIPELINE_ID:-local}
    env_file:
      - .env
    volumes:
      # Shared HF cache - the prewarmed w2v-bert / MaskGCT / etc. live here.
      - ${HF_CACHE_PATH:-~/.cache/huggingface}:/home/app/.cache/huggingface
      # IndexTTS-2 checkpoints (~6 GB).
      - ./models:/work/models
      # Bind-mount the host vendor venv (the ~10 GB torch+CUDA stack lives here,
      # NOT in the image layer). Read-only is safe because PYTHONDONTWRITEBYTECODE
      # + PYTHONPYCACHEPREFIX in the image redirect bytecode writes to /tmp.
      - ./vendor/index-tts:/work/vendor/index-tts:ro
    ports:
      - "${TTS_INDEXTTS2_PORT:-9881}:9881"
    networks:
      - default
    build:
      context: .
      dockerfile: Dockerfile.indextts2
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9881/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
