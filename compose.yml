# TTS Adapter - Local Development
# Usage:
#   Qwen3 only: docker compose --profile gpu up --build
#   Qwen3 + IndexTTS2: docker compose --profile gpu --profile indextts2 up --build
#   Easiest: `make up` (auto-detects which engines are installed)
#
# Note: TTS requires GPU (qwen-tts needs CUDA)

name: tts

networks:
  render-network:
    name: render-network
    driver: bridge

# GPU reservation block (shared via YAML anchor)
x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

# Shared volume + env mounts (HF cache + repo-local models + .env)
x-shared-mounts: &shared-mounts
  volumes:
    - ${HF_CACHE_PATH:-~/.cache/huggingface}:/home/app/.cache/huggingface
    - ./models:/work/models
  env_file:
    - .env

services:
  # Main TTS adapter (Qwen3 in-process + HTTP forwarder for IndexTTS2RemoteEngine)
  adapter-tts:
    <<: [*gpu, *shared-mounts]
    container_name: adapter-tts
    profiles: ["gpu"]
    restart: unless-stopped
    pull_policy: missing
    image: ${CI_REGISTRY_IMAGE:-tts}/adapter-tts:${CI_COMMIT_REF_SLUG:-latest}-${CI_PIPELINE_ID:-local}
    ports:
      - "${TTS_PORT:-9880}:9880"
    networks:
      - default
      - render-network
    build:
      context: .
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9880/health', timeout=10)"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  # IndexTTS2 worker (separate venv, isolated deps).
  # Activated only when --profile indextts2 is passed.
  # `make up` auto-adds this profile when models/indextts2/IndexTTS-2/ exists.
  adapter-tts-indextts2:
    <<: [*gpu, *shared-mounts]
    container_name: adapter-tts-indextts2
    profiles: ["indextts2"]
    restart: unless-stopped
    pull_policy: missing
    image: ${CI_REGISTRY_IMAGE:-tts}/adapter-tts-indextts2:${CI_COMMIT_REF_SLUG:-latest}-${CI_PIPELINE_ID:-local}
    # Worker reaches main adapter (and vice versa) via container hostnames on
    # the default project network. Main adapter overrides TTS_INDEXTTS2_URL
    # via .env to use http://adapter-tts-indextts2:9881 inside the network.
    ports:
      - "${TTS_INDEXTTS2_PORT:-9881}:9881"
    networks:
      - default
    build:
      context: .
      dockerfile: Dockerfile.indextts2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9881/health', timeout=10)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
