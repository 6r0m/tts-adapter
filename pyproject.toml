[project]
name = "tts-adapter"
version = "0.1.0"
description = "Universal TTS adapter with pluggable engines"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "fastapi>=0.128.0",
    "httpx>=0.24",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "qwen-tts>=0.0.5",
    "soundfile>=0.13.1",
    "uvicorn[standard]>=0.40.0",
]

[project.scripts]
tts-server = "tts_adapter.cli:main"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.24",
]
